[package]
name = "odm-viz-las"
version = "0.3.0"
edition = "2024"
description = "LAS/LAZ point cloud decoder for the browser (pure Rust, compiled to WebAssembly)"
license = "MIT"
repository = "https://github.com/anwaraliahmad/odm-viz"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
laz = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dev-dependencies]
laz = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
